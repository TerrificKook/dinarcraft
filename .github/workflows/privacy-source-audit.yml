name: Privacy source audit
on:
  push:
    branches: [fix/privacy-minimal-2026-09-29]
    paths: [.github/workflows/privacy-source-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked website text
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, json
          files = {}
          for n in subprocess.check_output(['git','ls-files'],text=True).splitlines():
              p=pathlib.Path(n)
              if p.suffix in {'.html','.js','.css','.json','.md','.yml','.yaml','.py','.xml','.txt'} or p.name in {'CNAME','.gitignore','.htaccess'}:
                  files[n]=p.read_text(encoding='utf-8')
          pathlib.Path('source-audit.json').write_text(json.dumps(files,ensure_ascii=False),encoding='utf-8')
          print('Exported text files:',len(files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: website-source-audit
          path: source-audit.json
          retention-days: 3
